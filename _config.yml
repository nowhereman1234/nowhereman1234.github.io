# ===========================================================
#  Hexo 主配置  —  nowhereman1234.github.io
#  修改站点标题 / 副标题 / 作者，只需改下面 # Site 这一段
# ===========================================================

# Site
title: nowhereland
subtitle: 'mathematics · notes · code'
description: 'Personal blog — notes on mathematics and whatever else is worth writing down.'
keywords: 'mathematics,notes,blog,code'
author: Nowhereman
language: en
timezone: 'Asia/Shanghai'

# URL
## 用户站点（<用户名>.github.io）必须用根路径，不能带子目录
url: https://nowhereman1234.github.io
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # 去掉链接里的 index.html
  trailing_html: true # 去掉链接里的 .html

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: prismjs
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Markdown 渲染器（由 hexo-renderer-markdown-it 提供）
#
# 换成 markdown-it 的唯一原因：它会在 Markdown 解析「之前」就把整段 $...$ / $$...$$
# 吃掉当成数学 token，从而保护公式里的 \\ 、\, 、_ 、* 不被当成 Markdown 语法。
#
# 旧的 hexo-renderer-marked 做不到这点，会把 align / cases / pmatrix 里的 \\ 吃成
# 「一个反斜杠 + <br>」，多行公式直接报废（实测过）。单行公式和下划线反而没问题。
markdown:
  preset: default
  render:
    html: true
    xhtmlOut: false
    breaks: true        # 与原来 marked 的行为保持一致（换行即 <br>）
    linkify: true
    typographer: false  # 关掉，避免智能标点污染数学内容
  anchors:
    level: 2
    collisionSuffix: ''
    permalink: false
    case: 0
    separator: '-'

# 数学公式（KaTeX）由 blog/scripts/markdown-math.js 挂载。
# 不在这里用 plugins: 配置，因为 markdown-it-texmath 需要传 katex 的引擎对象，
# YAML 无法表达；改用渲染器暴露的 markdown-it:renderer 过滤器。
#
# 写法约定：
#   行内  $...$
#   行间  $$...$$（整块包起来）
#   ⚠️ \begin{align} / cases / pmatrix 必须包在 $$ 里，否则 \\ 会被 Markdown 吃掉

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
# 注意：category_map / tag_map 只影响 URL(slug)，不会改变页面上的显示文字。
# 所以分类和标签请直接写英文，例如：
#   categories:
#     - Life
#   tags:
#     - Essay
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
theme: butterfly

# 本地搜索（配合 Butterfly 的 local_search）
search:
  path: search.xml
  field: post
  content: true
  format: html

# 站点地图，利于搜索引擎收录
sitemap:
  path: sitemap.xml
  rel: false
  tags: true
  categories: true

# Deployment —— 生成好的静态站点推送到 GitHub Pages 的 main 分支
## 用户站点仓库：nowhereman1234/nowhereman1234.github.io
deploy:
  type: git
  repo: https://github.com/nowhereman1234/nowhereman1234.github.io.git
  branch: main
  message: "Site updated: {{ now('YYYY-MM-DD HH:mm:ss') }}"
